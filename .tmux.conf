# reload setting file
bind r source-file ~/.tmux.conf \; display "Reloaded!"

set-option -g history-limit 10000

# defaul shell
set-option -g default-shell /bin/zsh

# set-option -g default-terminal 'screen-256color'
set-option -g default-terminal 'xterm-256color'
set -g terminal-overrides 'xterm:colors=256'

# prefix
set-option -g prefix C-q

# esc key
set -s escape-time 0

# status bar
set-option -g status-position top
set-option -g status-interval 1
set-option -g status-justify "left"
set-option -g status-left-length 20
set-option -g status-left "#{?client_prefix,#[reverse],}#[fg=colour255,bg=colour236] Session: #S #[default]"
set-option -g status-right-length 50
set-option -g status-right "#{?client_prefix,#[reverse],}#[fg=colour255,bg=colour236] %Y/%m/%d(%a) %H:%M:%S #[default]"

## カンペが長くなるので領域をさらに広げる (120 -> 150)
set-option -g status-right-length 150

## チートシート: Prefixが押されると青背景・白文字・太字でハイライトされます
set-option -g status-right "#{?client_prefix,#[fg=colour255,bg=colour27,bold] [C-q] #[default],#[fg=colour250] [C-q] #[default]}#[fg=colour250]c:Window | \":H-Split | %%:V-Split | o:Popup | d:Detach #[default] #[fg=colour255,bg=colour236] %Y/%m/%d(%a) %H:%M:%S #[default]"

set-window-option -g window-status-format " #I: #W "
set-window-option -g window-status-current-format "#[fg=colour255,bg=colour27,bold] #I: #W#{?window_zoomed_flag, [z],} #[default]"

# mouse
set-option -g mouse on

# popup
bind o display-popup -E -d "#{pane_current_path}" -w 80% -h 80%

# window
## current directory
bind c new-window -c '#{pane_current_path}'
## number
set-option -g renumber-windows on

## Prefixなしでウィンドウを切り替える (Shift + 左右矢印)
bind -n S-Left  previous-window
bind -n S-Right next-window

# pane

## current directory
bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

## Prefix(C-q)不要で、Option(Meta) + 矢印 でペインを移動する
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

#### COLOUR (Solarized dark)

# default statusbar colors
set-option -g status-bg black #base02
set-option -g status-bg colour241
set-option -g status-fg colour255

# default window title colors
set-window-option -g window-status-style bg=default,fg=colour250 #base0

# active window title colors
set-window-option -g window-status-current-style bg=default,fg=brightred #orange

# pane border
set-option -g pane-border-style fg=black #base02
set-option -g pane-active-border-style fg=brightgreen #base01

# message text
set-option -g message-style bg=black,fg=brightred #base02

# pane number display
set-option -g display-panes-active-colour blue #blue
set-option -g display-panes-colour brightred #orange

# clock
set-window-option -g clock-mode-colour green #green
